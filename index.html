<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>כניסה מוצפנת</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0A0F24;color:#E8EBFF;font-family:Arial,sans-serif}.box{width:min(430px,calc(100% - 36px));padding:34px;background:#121A3D;border:1px solid #26346E;border-top:4px solid #2DE2E6}h1{margin:0 0 8px;font-size:27px}p{color:#aab3e2;line-height:1.6}.error{color:#ff9ac5}label{display:block;margin:24px 0 8px}input,button{width:100%;box-sizing:border-box;padding:13px;font-size:17px}input{background:#0A0F24;color:#E8EBFF;border:1px solid #26346E}button{margin-top:15px;border:0;background:#2DE2E6;color:#0A0F24;font-weight:bold;cursor:pointer}</style></head><body><main class="box"><h1>מדריך כיסויי בריאות</h1><p>תוכן האתר מוצפן. הזן סיסמה כדי לפענח אותו בדפדפן שלך.</p><form id="login"><label for="password">סיסמה</label><input id="password" type="password" autocomplete="current-password" required autofocus><button>פתיחה</button></form><p id="message" class="error" hidden>הסיסמה אינה תקינה.</p></main><script>const b64=v=>Uint8Array.from(atob(v),c=>c.charCodeAt(0));document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('message');msg.hidden=true;try{const data=await fetch('site.enc.json',{cache:'no-store'}).then(r=>r.json());const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(data.salt),iterations:data.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const merged=new Uint8Array(b64(data.ciphertext).length+b64(data.tag).length);merged.set(b64(data.ciphertext));merged.set(b64(data.tag),b64(data.ciphertext).length);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(data.iv)},key,merged);document.open();document.write(new TextDecoder().decode(plain));document.close()}catch(_){msg.hidden=false}});</script></body></html>
